# Compile, test and execute both generated examples. MIT License.
name: Build and demo
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  windows-checkout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test portable path validator on Windows
        run: python scripts/test-portable-paths.py
      - name: Validate portable tracked paths on Windows
        run: python scripts/check-portable-paths.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run all unit tests on Windows
        run: mvn -B -ntp test
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable tracked paths
        run: |
          python3 scripts/test-portable-paths.py
          python3 scripts/check-portable-paths.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test mandatory C++03 compiler bootstrap
        run: python3 scripts/test-cpp03-compilers.py
      - name: Ensure mandatory C++03 compilers
        run: python3 scripts/ensure-cpp03-compilers.py
      - name: Install Graphviz for SVG end-to-end checks
        run: command -v dot || (sudo apt-get update && sudo apt-get install -y graphviz)
      - run: mvn -B verify
      - name: Validate catalogue signatures against real C++03 libraries
        run: bash scripts/probe-cpp03-library-catalogue.sh
      - name: Verify complete C++03 corpus discovery
        run: python3 scripts/check-cpp03-reports.py
      - name: Validate C++03 paragraph evidence records
        run: |
          python3 scripts/test-cpp03-library-macros.py
          python3 scripts/check-cpp03-library-macros.py
          python3 scripts/test-inventory-cpp03-source.py
          python3 scripts/test-cpp03-paragraphs.py
          python3 scripts/check-cpp03-paragraphs.py --require-source-complete
      - name: Validate JavaDoc including internal parser and analysis classes
        run: |
          mvn -B dependency:build-classpath -Dmdep.includeScope=compile -Dmdep.outputFile=target/javadoc-classpath
          javadoc -classpath "$(cat target/javadoc-classpath)" -quiet -Werror -private -Xdoclint:all,-missing -sourcepath src/main/java -subpackages com.kniazkov.cpg -d target/apidocs
      - run: bash scripts/demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cpg-prototype
          path: |
            target/cpg-*.jar
            target/demo/
            target/runtime-integer-oracle/
            target/varargs-runtime-oracle/
            target/errno-runtime-oracle/
            target/mb-cur-max-oracle/
            target/standard-streams-oracle/
            target/weof-runtime-oracle/
            target/clock-scale-oracle/
            target/huge-val-oracle/
            target/signal-dispositions-oracle/
            target/pod-layout-oracle/
            target/offsetof-oracle/
            target/offsetof-context-oracle/
            target/member-pointer-layout-oracle/
            target/enum-storage-layout-oracle/
            target/constant-template-arguments-oracle/
            target/partial-constant-template-arguments-oracle/
