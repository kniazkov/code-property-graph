  verification: []
  status: draft
- id: CPP03-3.4-001
  type: requirement
  modality: shall
  normative: true
  title: Unambiguous lookup
  statement: Name lookup shall find an unambiguous declaration; it may find several declarations
    only for a function name, forming an overload set.
  subject: name lookup
  condition: always
  requirement: shall find an unambiguous declaration or an overload set
  exceptions: []
  depends_on: []
  related: []
