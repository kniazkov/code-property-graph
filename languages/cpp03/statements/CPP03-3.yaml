schema_version: 1
edition: N1638
clause: '3'
title: Basic concepts
statements:
- id: CPP03-3-001
  type: definition
  modality: is
  normative: true
  title: entity
  statement: Entities include values, objects, subobjects, base-class subobjects, array elements,
    variables, functions, function instances, enumerators, types, class members, templates,
    and namespaces.
  subject: entity
  condition: always
  requirement: is one of the listed kinds
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3/3
    fingerprint: sha256:1470cd54a1af3534ac3524be300641532fe70aa3ca4267ad987309708b57fb12
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3-002
  type: definition
  modality: is
  normative: true
  title: name and variable
  statement: A name is an identifier use that denotes an entity or label; a variable is introduced
    by an object declaration, and its name denotes the object.
  subject: name
  condition: always
  requirement: denotes an entity or label
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3/4
    fingerprint: sha256:189abc5af12da5a2fe6e1ac6075d2c7dd1a4fa101e3462ded9c2c12652571e51
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3-003
  type: requirement
  modality: shall
  normative: true
  title: Name introduction
  statement: Every name denoting an entity shall be introduced by a declaration; every name
    denoting a label shall be introduced by a goto statement or a labeled statement.
  subject: name
  condition: always
  requirement: shall be introduced by a declaration or label construct
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3/5
    fingerprint: sha256:9ccd7d9133fbe71a185d6a3c8ce1596e76bbb8e6dd8a55d2e73ac736188d66c8
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3-004
  type: definition
  modality: is
  normative: true
  title: name lookup
  statement: The process that determines whether a name denotes a type, class, enumeration,
    or template is called name lookup.
  subject: name lookup
  condition: always
  requirement: determines the meaning of a name
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3/6
    fingerprint: sha256:a25286eab811a08f189b6de956e94475c875ca52c1c55ce45478119f272cc21c
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3-005
  type: definition
  modality: is
  normative: true
  title: same name
  statement: Two names are the same when they are identical character sequences, names of
    overloaded operator functions with the same operator, or names of conversion functions
    with the same type.
  subject: same name
  condition: always
  requirement: is defined by identifier or operator or conversion type
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3/7
    fingerprint: sha256:4b1381313a52ef738b89c55a98d92c40698ae2358320960d2e78ae1cd3b23845
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3-006
  type: definition
  modality: is
  normative: true
  title: linkage and identity
  statement: An identifier used in several translation units can denote the same entity depending
    on the linkage specified in each translation unit.
  subject: identifier
  condition: used in several translation units
  requirement: denotes the same entity according to linkage
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3/8
    fingerprint: sha256:e95829831bb609aee5def32c22ebcc761cba438332533664dfccf58e5ab4e15d
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.1-001
  type: definition
  modality: is
  normative: true
  title: declaration
  statement: A declaration introduces names into a translation unit or redeclares earlier
    names and specifies their interpretation and attributes.
  subject: declaration
  condition: always
  requirement: introduces or redeclares names
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.1/1
    fingerprint: sha256:6bc4562a9e0ed507a2fed258eaf0a380cc0c83d59cff1231bb2af09dc8e7bb98
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.1-002
  type: definition
  modality: is
  normative: true
  title: declaration versus definition
  statement: A declaration counts as a definition except when it declares a bodyless function,
    uses extern or a linkage-specification without initializer/body, declares a static data
    member, names a class, or is a typedef, using-declaration, or using-directive.
  subject: declaration
  condition: always
  requirement: is a definition except in the listed cases
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.1/2
    fingerprint: sha256:1904ac21e57d2275948f8a2ce982724a9028253611e56c1eb6c6424b5511080c
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.1-003
  type: constraint
  modality: is
  normative: true
  title: Incomplete object type
  statement: A program is ill-formed if the definition of an object gives it an incomplete
    type.
  subject: program
  condition: object definition uses incomplete type
  requirement: is ill-formed
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.1/6
    fingerprint: sha256:1e214502d01e20904354d4364d89224c3301325d0be22e9c23424b5537d148a3
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.2-001
  type: requirement
  modality: shall_not
  normative: true
  title: One definition per translation unit
  statement: Within one translation unit, a variable, function, class type, enumeration type,
    or template may be defined only once.
  subject: translation unit
  condition: always
  requirement: shall not define an entity more than once
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.2/1
    fingerprint: sha256:618774de152f1492bccf4b206affa9c8cc32a4a72c2f724283ffe789ae171f2f
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.2-002
  type: requirement
  modality: shall
  normative: true
  title: Exactly one used definition
  statement: Each used non-inline function or object needs exactly one definition in the program;
    a used inline function needs a definition in every translation unit that uses it.
  subject: program
  condition: entity is used
  requirement: shall contain exactly one definition
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.2/3
    fingerprint: sha256:b34a2a1aee077062de63fbed79ce7a71efa58acc827a16cbad7f7461d63cf493
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.2-003
  type: requirement
  modality: is
  normative: true
  title: Complete class definition
  statement: When a class must be complete in a translation unit, that unit needs exactly
    one definition of the class.
  subject: translation unit
  condition: class must be complete
  requirement: requires exactly one class definition
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.2/4
    fingerprint: sha256:d218f08f8017052b214d7d0a29d923d6f56afb278c528306287f2ceb61e9180b
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.2-004
  type: constraint
  modality: is
  normative: true
  title: Multiple definitions
  statement: Multiple definitions of certain entities are allowed across translation units
    only if they consist of the same tokens and satisfy the ODR name and operator requirements;
    otherwise the behavior is undefined.
  subject: program
  condition: entity has multiple definitions
  requirement: must satisfy the ODR requirements
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.2/5
    fingerprint: sha256:4cc3b957ac817f629d48eaaea23c5d01c0726e2218e051a98fa21abd0e27b7d2
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3-001
  type: definition
  modality: is
  normative: true
  title: declarative region and scope
  statement: A declarative region is the largest program portion in which a name is valid;
    a name's scope is its potential scope minus any inner declaration of the same name.
  subject: scope
  condition: always
  requirement: is the potential scope excluding inner redeclarations
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3/1
    fingerprint: sha256:ecd4935c7d4a334dfd3112e67c0826a9d87a3320f19942963f0e8b02cb7084a5
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3-002
  type: requirement
  modality: is
  normative: true
  title: Name introduction into a scope
  statement: Declared names are introduced into the scope containing the declaration, except
    that friend specifiers, some elaborated-type-specifiers, and using-directives alter this
    behavior.
  subject: declared name
  condition: always
  requirement: is introduced into the declaring scope
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3/3
    fingerprint: sha256:d5a86fe60f992b6ecb742df734cb4c693a1f321c4c5fde876a211bcdb2c8d00f
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3-003
  type: requirement
  modality: shall
  normative: true
  title: Same unqualified name
  statement: Declarations of the same unqualified name in one declarative region shall all
    refer to the same entity or to functions and function templates, or one shall declare
    a class or enumeration name with the others referring to the same object or functions.
  subject: declarations
  condition: same unqualified name in one region
  requirement: shall refer to the same entity or overload set
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3/4
    fingerprint: sha256:80026f40a0453b9f0586453b18e9d7cd9f9f72d3c65be916f45b1de158f75fb7
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.1-001
  type: definition
  modality: is
  normative: true
  title: point of declaration
  statement: A name's point of declaration is immediately after its complete declarator and
    before its initializer, unless a special rule applies.
  subject: point of declaration
  condition: always
  requirement: follows the complete declarator
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.1/1
    fingerprint: sha256:96db80fa1e4325f761d85abdb0be3442d0486e0f9027251f8c199ac9aa38979a
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.1-002
  type: definition
  modality: is
  normative: true
  title: enumerator point of declaration
  statement: An enumerator's point of declaration is immediately after its enumerator-definition.
  subject: enumerator
  condition: always
  requirement: is declared after its definition
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.1/3
    fingerprint: sha256:031fa1b9b73d5cfeebdf1381f5f26ac7111a223752fa43216d5869a5410b7302
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.1-003
  type: definition
  modality: is
  normative: true
  title: class member point of declaration
  statement: After a class member's point of declaration, its name can be looked up in the
    class scope, even if the class is incomplete.
  subject: class member
  condition: after its point of declaration
  requirement: can be found in class scope
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.1/4
    fingerprint: sha256:a65390aacbf889bbc248ad7e43f40cd21771e198a07e72107e8c4baa77fa6dd8
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.1-004
  type: definition
  modality: is
  normative: true
  title: elaborated-type-specifier point of declaration
  statement: A class introduced by an elaborated-type-specifier is declared in the containing
    scope, in the namespace of a namespace-scope function, or in the smallest enclosing non-class
    non-prototype scope, as applicable.
  subject: elaborated-type-specifier
  condition: first declares a class
  requirement: declares the class in the applicable scope
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.1/5
    fingerprint: sha256:6554ad107bac94a052fb29f8824eb42e943fe25c8dfff6558d8ad4f6fffa3693
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.1-005
  type: definition
  modality: is
  normative: true
  title: injected-class-name point of declaration
  statement: An injected-class-name is declared immediately after the opening brace of the
    class definition.
  subject: injected-class-name
  condition: always
  requirement: is declared at the class opening brace
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.1/6
    fingerprint: sha256:574f5e3c8e5387aa02fc1fb325a946de11ef8a4f84838540e4c837e1a0e531dc
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.2-001
  type: definition
  modality: is
  normative: true
  title: local scope
  statement: A block-declared name is local to that block; its potential scope runs from its
    declaration point to the end of the declarative region.
  subject: local name
  condition: always
  requirement: is scoped to its block
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.2/1
    fingerprint: sha256:89dec3e8df27afe9470a543141c29f5193dc0249472e7b0e0cdb08ac66b34c04
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.2-002
  type: requirement
  modality: shall_not
  normative: true
  title: Parameter redeclaration
  statement: A parameter name must not be redeclared in the function's outermost block or
    in the outermost block of an associated handler.
  subject: parameter name
  condition: in a function definition
  requirement: shall not be redeclared in the outermost block
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.2/2
    fingerprint: sha256:386214a583b8e00d02373bfee8d90fa8d9f92bdcaf83bb0a99d40e11da98de41
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.2-003
  type: requirement
  modality: shall_not
  normative: true
  title: Catch parameter redeclaration
  statement: A catch exception-declaration name is local to its handler and shall not be redeclared
    in the handler's outermost block.
  subject: catch parameter name
  condition: always
  requirement: shall not be redeclared in the handler block
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.2/3
    fingerprint: sha256:b0497b6b6a8af304b48798e94b3eb022ed6fdb39bd11d9901af95f34e3885753
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.2-004
  type: requirement
  modality: shall_not
  normative: true
  title: Control-statement names
  statement: Names declared in a for-init-statement or in an if, while, for, or switch condition
    are local to that statement and shall not be redeclared in a later condition or in the
    controlled statement's outermost block.
  subject: control-statement name
  condition: always
  requirement: shall not be redeclared in the controlled scope
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.2/4
    fingerprint: sha256:1ba7146ec33b3be7e824d548cefbff48d34f35cf8a7bf087c4f7bbe52be2d26e
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.3-001
  type: definition
  modality: is
  normative: true
  title: function prototype scope
  statement: In a function declaration or non-defining function declarator, parameter names
    have function prototype scope ending at the nearest enclosing function declarator.
  subject: parameter name
  condition: in a function declaration
  requirement: has function prototype scope
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.3/1
    fingerprint: sha256:ffc6a49ca81c6bec431d5ad028b7bc936b9e253eb207de14bf40cd57c732aaf4
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.4-001
  type: definition
  modality: is
  normative: true
  title: function scope
  statement: Labels have function scope and may be used anywhere in their function; only labels
    have function scope.
  subject: label
  condition: always
  requirement: has function scope
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.4/1
    fingerprint: sha256:7fb9a7c09794a8bf2b900ce859e571a6bc56ae43e16af9e210f497930bd68109
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.5-001
  type: definition
  modality: is
  normative: true
  title: namespace scope
  statement: A namespace-definition's declarative region is its namespace-body; entities declared
    there are namespace members with namespace scope.
  subject: namespace member
  condition: always
  requirement: has namespace scope
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.5/1
    fingerprint: sha256:882a60e64493c940361d85100d374d5124f39dfd103a703d377746c53a1e83c1
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.5-002
  type: definition
  modality: is
  normative: true
  title: global namespace
  statement: The outermost declarative region of a translation unit is the global namespace;
    names declared there have global namespace scope.
  subject: global namespace
  condition: always
  requirement: is the outermost declarative region
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.5/3
    fingerprint: sha256:5ccf589eba7e552a4bc3c0b565d03a52fcb860389606a294e4c7b336463902ac
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.6-001
  type: requirement
  modality: shall
  normative: true
  title: Class scope consistency
  statement: A name used in a class must resolve to the same declaration both at its use and
    when the class scope is complete; violating this needs no diagnostic.
  subject: class-scope name
  condition: always
  requirement: shall have consistent lookup
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.6/1
    fingerprint: sha256:0a6372a61c332310fe4c886942bf20697356616bdea91d8f8a4d6e9dee60c69b
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.6-002
  type: constraint
  modality: is
  normative: true
  title: Reordering class members
  statement: If reordering member declarations yields an alternate valid program under the
    class-scope rules, the program is ill-formed and no diagnostic is required.
  subject: program
  condition: class members can be reordered to a valid alternative
  requirement: is ill-formed
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.6/1
    fingerprint: sha256:0a6372a61c332310fe4c886942bf20697356616bdea91d8f8a4d6e9dee60c69b
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-3.3.6-003
  type: requirement
  modality: shall
  normative: true
  title: Class member access
  statement: 'A class member name shall be used only in its class or derived class scope,
    after . or -> on an object or pointer of that class, or after :: applied to the class
    name.'
  subject: class member name
  condition: always
  requirement: shall be used only in the listed ways
  exceptions: []
  depends_on: []
  related: []
  provenance:
