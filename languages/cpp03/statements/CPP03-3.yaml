  verification: []
  status: draft
- id: CPP03-3.3.7-003
  type: definition
  modality: is
  normative: true
  title: visible name
  statement: A name that is in scope and not hidden is visible.
  subject: name
  condition: in scope and not hidden
  requirement: is visible
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.7/5
