  verification: []
  status: draft
- id: CPP03-3.3.7-002
  type: definition
  modality: is
  normative: true
  title: class and enumeration hiding
  statement: A class or enumeration name can be hidden by an object, function, or enumerator
    name declared in the same scope.
  subject: class or enumeration name
  condition: same-scope non-type declaration exists
  requirement: is hidden
  exceptions: []
  depends_on: []
  related: []
  provenance:
