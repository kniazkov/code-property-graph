  verification: []
  status: draft
- id: CPP03-3.3.7-001
  type: definition
  modality: is
  normative: true
  title: name hiding
  statement: An explicit same-name declaration in a nested region or derived class can hide
    an outer name.
  subject: name
  condition: nested declaration exists
  requirement: is hidden
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 3.3.7/1
