  - id: CPP03-2.13.1-003
    type: grammar
    modality: is
    normative: true
    title: "octal-literal production"
    statement: >
      octal-literal is either a single 0 or an octal-literal followed by an
      octal-digit.
    subject: "octal-literal"
    condition: "any octal-literal"
    requirement: "0 | octal-literal octal-digit"
