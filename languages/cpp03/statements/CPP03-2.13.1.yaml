title: "Integer literals"
statements:
  - id: CPP03-2.13.1-001
    type: grammar
    modality: is
    normative: true
    title: "integer-literal production"
    statement: >
      integer-literal has three alternatives: decimal-literal with an optional
      integer-suffix, octal-literal with an optional integer-suffix, and
      hexadecimal-literal with an optional integer-suffix.
    subject: "integer-literal"
    condition: "any integer-literal"
    requirement: "decimal-literal integer-suffix? | octal-literal integer-suffix? | hexadecimal-literal integer-suffix?"
    exceptions: []
    depends_on: [CPP03-2.13.1-002, CPP03-2.13.1-003, CPP03-2.13.1-004, CPP03-2.13.1-008]
    related: []
    provenance:
