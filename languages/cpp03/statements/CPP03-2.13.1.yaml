    type: grammar
    modality: is
    normative: true
    title: "decimal-literal production"
    statement: >
      decimal-literal is either a single nonzero-digit or a decimal-literal
      followed by a digit.
    subject: "decimal-literal"
    condition: "any decimal-literal"
    requirement: "nonzero-digit | decimal-literal digit"
