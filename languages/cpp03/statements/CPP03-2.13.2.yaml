  modality: is
  normative: true
  title: c-char-sequence production
  statement: 'c-char-sequence is either a single c-char or a c-char-sequence followed by a
    c-char.

    '
  subject: c-char-sequence
  condition: any c-char-sequence
  requirement: c-char | c-char-sequence c-char
