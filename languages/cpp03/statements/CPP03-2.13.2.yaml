title: Character literals
statements:
- id: CPP03-2.13.2-001
  type: grammar
  modality: is
  normative: true
  title: character-literal production
  statement: 'character-literal is a c-char-sequence in single quotes, or a c-char-sequence
    in single quotes preceded by L.

    '
  subject: character-literal
  condition: any character-literal
  requirement: '''c-char-sequence'' | L''c-char-sequence'''
  exceptions: []
  depends_on:
