- id: CPP03-2.13.2-003
  type: grammar
  modality: is
  normative: true
  title: c-char production
  statement: 'c-char is any member of the source character set except the single quote, the
    backslash, and the new-line character; or an escape-sequence; or a universal-character-name.

    '
  subject: c-char
  condition: any c-char
  requirement: source char except ' \ newline | escape-sequence | universal-character-name
  exceptions: []
