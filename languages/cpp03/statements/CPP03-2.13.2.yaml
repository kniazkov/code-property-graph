- id: CPP03-2.13.2-008
  type: definition
  modality: is
  normative: true
  title: Form of a character literal
  statement: 'The spelling of a character literal consists of one or more characters between
    single quote marks, with an optional leading L.

    '
  subject: character literal
  condition: any character literal
  requirement: one or more characters between single quote marks; optional L prefix
