- id: CPP03-1.9-008
  type: constraint
  modality: is
  normative: true
  title: Undefined operation in the sequence
  statement: If an execution sequence contains an undefined operation, this International
    Standard imposes no requirement on the implementation for that program and input, including
    operations before the first undefined operation.
  subject: implementation
  condition: execution sequence contains undefined operation
  requirement: has no requirement imposed
  exceptions: []
