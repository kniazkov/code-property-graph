  type: definition
  modality: is
  normative: true
  title: diagnosable rules
  statement: The diagnosable rules are all syntactic and semantic rules of this International
    Standard except rules marked as requiring no diagnostic and rules whose violation is undefined
    behavior.
  subject: diagnosable rules
  condition: always
