- id: CPP03-1.3.10-001
  type: definition
  modality: is
  normative: true
  title: signature
  statement: 'A function''s signature is the information used in overload resolution: its
    parameter-type-list and, for a member function, the cv-qualifiers on the function and
    on its class. A function template specialization''s signature also includes the types
    of its template arguments.'
  subject: signature
  condition: always
  requirement: is the overload-resolution information
