- id: CPP03-1.3.12-002
  type: informative_note
  modality: informative
  normative: false
  title: Range of undefined behavior
  statement: Permissible undefined behavior ranges from ignoring the situation with unpredictable
    results, through documented environment-specific behavior, to terminating translation
    or execution with a diagnostic; many erroneous constructs are instead required to be diagnosed.
  subject: undefined behavior
  condition: in practice
  requirement: may take any of the listed forms
  exceptions: []
  depends_on: []
