- id: CPP03-1.9-011
  type: requirement
  modality: shall
  normative: true
  title: Sequence-point side effects
  statement: Between sequence points, earlier evaluations must have finished their side effects
    and later ones must not have begun.
  subject: side effects
  condition: at a sequence point
  requirement: shall be complete for previous and not started for subsequent evaluations
  exceptions: []
