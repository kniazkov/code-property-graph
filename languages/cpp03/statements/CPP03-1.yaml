- id: CPP03-1.3.11-001
  type: definition
  modality: is
  normative: true
  title: static type
  statement: The static type of an expression is the type obtained by analyzing the program
    without execution semantics; it depends only on the program form and does not change during
    execution.
  subject: static type
  condition: always
  requirement: is determined by program form only
