  type: requirement
  modality: shall
  normative: true
  title: Function execution ordering
  statement: After a function's execution begins, no expression of the calling function is
    evaluated until the called function's execution completes.
  subject: function call
  condition: after callee execution begins
  requirement: shall not evaluate caller expressions until completion
