- id: CPP03-1.3.8-001
  type: definition
  modality: is
  normative: true
  title: multibyte character
  statement: A multibyte character is a sequence of one or more bytes that represents a member
    of the extended character set of the source or execution environment; that set is a superset
    of the basic character set.
  subject: multibyte character
  condition: always
  requirement: is a byte sequence for an extended character
