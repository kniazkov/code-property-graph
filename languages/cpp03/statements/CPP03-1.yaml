  normative: true
  title: argument
  statement: 'An argument is one of: an expression in a call''s parenthesized list, a preprocessing-token
    run in a function-like macro call, the throw operand, or an expression, type-id, or template-name
    inside a template instantiation''s angle brackets. Synonyms are actual argument and actual
    parameter.'
