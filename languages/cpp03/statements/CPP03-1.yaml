  type: definition
  modality: is
  normative: true
  title: parameter
  statement: A parameter is an object or reference declared in a function declaration or definition
    or in a catch clause, an identifier in a function-like macro parameter list, or a template-parameter.
    It is also called a formal argument or formal parameter.
  subject: parameter
  condition: always
  requirement: is one of the listed declarations
