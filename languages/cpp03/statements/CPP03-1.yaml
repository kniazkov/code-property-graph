- id: CPP03-1.9-009
  type: definition
  modality: is
  normative: true
  title: Observable behavior
  statement: Observable behavior consists of volatile-data reads and writes plus calls into
    library I/O.
  subject: observable behavior
  condition: always
  requirement: is volatile access and library I/O calls
