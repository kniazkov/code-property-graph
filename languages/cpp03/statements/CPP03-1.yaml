- id: CPP03-1.3.12-001
  type: definition
  modality: is
  normative: true
  title: undefined behavior
  statement: Undefined behavior is behavior, possibly from an erroneous construct or data,
    for which this International Standard imposes no requirements; it may also arise when
    no behavior is explicitly defined.
  subject: undefined behavior
  condition: always
  requirement: has no requirements imposed
  exceptions: []
  depends_on: []
