- id: CPP03-1.3.13-001
  type: definition
  modality: is
  normative: true
  title: unspecified behavior
  statement: Unspecified behavior is behavior of a well-formed construct with correct data
    that depends on the implementation; the implementation need not document which behavior
    occurs.
  subject: unspecified behavior
  condition: always
  requirement: depends on the implementation without documentation
  exceptions: []
