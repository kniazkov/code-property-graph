  normative: true
  title: well-formed program
  statement: A well-formed program is a C++ program constructed according to the syntax rules,
    the diagnosable semantic rules, and the One Definition Rule.
  subject: well-formed program
  condition: always
  requirement: obeys syntax, diagnosable semantics, and the ODR
  exceptions: []
