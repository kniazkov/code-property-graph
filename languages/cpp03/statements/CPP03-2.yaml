  modality: informative
  normative: false
  title: Preprocessing number example
  statement: The fragment 1Ex is one preprocessing number, even though splitting it into 1
    and Ex could yield a valid expression.
  subject: 1Ex
  condition: always
  requirement: is a single preprocessing number
