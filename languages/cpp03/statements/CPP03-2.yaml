- id: CPP03-2.5-001
  type: definition
  modality: is
  normative: true
  title: Alternative tokens
  statement: Alternative token representations exist for some operators and punctuators.
  subject: alternative token
  condition: always
  requirement: is an alternative spelling of a primary token
