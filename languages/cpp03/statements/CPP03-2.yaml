schema_version: 1
edition: N1638
clause: '2'
title: Lexical conventions
statements:
- id: CPP03-2-001
  type: definition
  modality: is
  normative: true
  title: source file and translation unit
  statement: Program text is kept in source files. A source file together with the headers
    and included source files, after skipping excluded conditional lines, forms a translation
    unit.
  subject: translation unit
  condition: always
  requirement: is a source file plus its included headers and sources
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2/1
    fingerprint: sha256:f742644e29dd6d2d1d201b2056815b405dd59650cec96ea406519dd61280dd1f
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2-002
  type: informative_note
  modality: informative
  normative: false
  title: Separate translation
  statement: Translation units may be translated separately and later linked; they communicate
    through external-linkage functions and objects or through data files.
  subject: translation units
  condition: when translated separately
  requirement: communicate through external linkage or files
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2/2
    fingerprint: sha256:e3555e0bde1eba46b2ad5102d39961f789daa4e1c0cc1c0f3f473916f790c083
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-001
  type: requirement
  modality: is
  normative: true
  title: Translation phase order
  statement: The precedence among translation syntax rules is given by nine ordered translation
    phases.
  subject: translation
  condition: always
  requirement: follows the nine ordered phases
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-002
  type: requirement
  modality: is
  normative: true
  title: 'Phase 1: character mapping'
  statement: In phase 1, physical source characters are mapped in an implementation-defined
    way to the basic source character set, trigraphs are replaced, and characters outside
    that set become universal-character-names; any internal encoding is allowed if it treats
    an extended character and its universal-character-name equivalently.
  subject: source characters
  condition: phase 1
  requirement: are mapped to the basic source character set
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-003
  type: requirement
  modality: is
  normative: true
  title: 'Phase 2: line splicing'
  statement: In phase 2, each new-line preceded by a backslash is deleted, splicing physical
    lines into logical lines.
  subject: source lines
  condition: phase 2
  requirement: are spliced by removing backslash-new-line
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-004
  type: behavior_undefined
  modality: undefined
  normative: true
  title: Line splicing hazards
  statement: The behavior is undefined if line splicing produces a universal-character-name,
    or if a non-empty source file lacks a final new-line or ends in a backslash-new-line.
  subject: source file
  condition: line splicing produces a UCN or the file ends abnormally
  requirement: has undefined behavior
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-005
  type: requirement
  modality: shall
  normative: true
  title: 'Phase 3: tokenization'
  statement: In phase 3, the file becomes preprocessing tokens and white-space runs; it must
    not stop inside a token or comment, and a comment becomes a single space.
  subject: source file
  condition: phase 3
  requirement: shall not end in a partial token or comment
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-006
  type: behavior_implementation_defined
  modality: implementation_defined
  normative: true
  title: 'Phase 3: white space retention'
  statement: Whether a non-new-line white-space run is kept or collapsed to one space is implementation-defined.
  subject: white space
  condition: phase 3
  requirement: is implementation-defined
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-007
  type: requirement
  modality: is
  normative: true
  title: 'Phase 4: directives and macros'
  statement: Phase 4 runs preprocessing directives and expands macro calls; an included file
    is reprocessed from phase 1 to phase 4.
  subject: preprocessing
  condition: phase 4
  requirement: executes directives and expands macros
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-008
  type: behavior_undefined
  modality: undefined
  normative: true
  title: 'Phase 4: token concatenation hazard'
  statement: The behavior is undefined if token concatenation produces a universal-character-name.
  subject: token concatenation
  condition: phase 4
  requirement: has undefined behavior when it forms a UCN
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-009
  type: requirement
  modality: is
  normative: true
  title: 'Phase 5: execution character set'
  statement: In phase 5, each source character, escape sequence, or universal-character-name
    in character and string literals is converted to the execution character set.
  subject: literal characters
  condition: phase 5
  requirement: are converted to the execution character set
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-010
  type: requirement
  modality: is
  normative: true
  title: 'Phase 6: string concatenation'
  statement: Phase 6 joins neighboring ordinary string literals and, separately, neighboring
    wide string literals.
  subject: string literals
  condition: phase 6
  requirement: are concatenated when adjacent and of the same kind
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-011
  type: requirement
  modality: is
  normative: true
  title: 'Phase 7: token conversion and analysis'
  statement: In phase 7, separating white space is no longer significant, each preprocessing
    token becomes a token, and the tokens are analyzed and translated.
  subject: preprocessing tokens
  condition: phase 7
  requirement: become tokens and are analyzed
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-012
  type: requirement
  modality: is
  normative: true
  title: 'Phase 8: instantiation'
  statement: In phase 8, translated translation units are examined for required instantiations,
    the needed template definitions are located, and the instantiations are performed; whether
    the definition source must be available is implementation-defined.
  subject: translation units
  condition: phase 8
  requirement: produce required instantiations
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-013
  type: constraint
  modality: is
  normative: true
  title: Instantiation failure
  statement: The program is ill-formed if any required instantiation fails.
  subject: program
  condition: instantiation fails
  requirement: is ill-formed
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-014
  type: requirement
  modality: is
  normative: true
  title: 'Phase 9: linking'
  statement: In phase 9, external object and function references are resolved, library components
    satisfy external references, and translator output is collected into a program image.
  subject: translation
  condition: phase 9
  requirement: resolves external references and builds the program image
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.1-015
  type: requirement
  modality: shall
  normative: true
  title: Phases are conceptual
  statement: Implementations must behave as if the separate translation phases occur, even
    if they are folded together in practice.
  subject: implementation
  condition: always
  requirement: shall behave as if the phases are separate
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.1/1
    fingerprint: sha256:3c3b364ce64e0e0d920197245af46123c0facec7b9dbc256790d1e72d72c7d62
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.2-001
  type: definition
  modality: is
  normative: true
  title: Basic source character set
  statement: 'The basic source character set has 96 characters: space, four control characters,
    and 91 graphical characters.'
  subject: basic source character set
  condition: always
  requirement: contains 96 characters
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.2/1
    fingerprint: sha256:562249f8795b504a6a18dc89cbd811287a5b9d035ae4e596f29318dae4f6ab1d
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.2-002
  type: grammar
  modality: is
  normative: true
  title: universal-character-name production
  statement: A universal-character-name is either \u followed by one hex-quad or \U followed
    by two hex-quads; a hex-quad is four hexadecimal digits.
  subject: universal-character-name
  condition: always
  requirement: has the \u or \U form
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.2/grammar
    fingerprint: sha256:3128d9727b2ce2d2894fce0d2c42c811de297157d3f13712a0711c2b0ca2dee0
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.2-003
  type: definition
  modality: is
  normative: true
  title: Universal character naming
  statement: \UNNNNNNNN names the ISO/IEC 10646 character with short name NNNNNNNN, and \uNNNN
    names the character with short name 0000NNNN.
  subject: universal-character-name
  condition: always
  requirement: names the corresponding ISO/IEC 10646 character
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.2/2
    fingerprint: sha256:11851112f478bfc499f8218dead279468319d99dadd952bc916b5249059e07ee
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.2-004
  type: constraint
  modality: is
  normative: true
  title: Invalid universal character names
  statement: A program is ill-formed if a universal-character-name has a value below 0x20,
    in 0x7F through 0x9F, or names a character of the basic source character set.
  subject: program
  condition: universal-character-name is in a forbidden range
  requirement: is ill-formed
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.2/2
    fingerprint: sha256:11851112f478bfc499f8218dead279468319d99dadd952bc916b5249059e07ee
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.2-005
  type: requirement
  modality: shall
  normative: true
  title: Basic execution character sets
  statement: The basic execution character set and basic execution wide-character set shall
    each contain the basic source characters, alert, backspace, carriage return, and a null
    character with all-zero representation.
  subject: basic execution character sets
  condition: always
  requirement: shall contain the listed characters
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.2/3
    fingerprint: sha256:f52872f849533727ae604e92f4083492bb92c203a7881a4f4fd73ec28c3331bb
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.2-006
  type: requirement
  modality: shall
  normative: true
  title: Character values
  statement: Members of a basic execution character set shall have non-negative, mutually
    distinct values, and decimal digit values shall increase by one from 0 onward.
  subject: basic execution character values
  condition: always
  requirement: shall be non-negative, distinct, and consecutive for digits
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.2/3
    fingerprint: sha256:f52872f849533727ae604e92f4083492bb92c203a7881a4f4fd73ec28c3331bb
    extracted_at: '2026-11-27'
  verification: []
  status: draft
- id: CPP03-2.2-007
  type: behavior_implementation_defined
  modality: implementation_defined
  normative: true
  title: Execution character set values
  statement: The execution character set and execution wide-character set are supersets of
    the basic sets; their member values are implementation-defined and additional members
    are locale-specific.
  subject: execution character sets
  condition: always
  requirement: have implementation-defined values and locale-specific additions
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.2/3
    fingerprint: sha256:f52872f849533727ae604e92f4083492bb92c203a7881a4f4fd73ec28c3331bb
    extracted_at: '2026-11-27'
  verification: []
  status: draft
