  status: draft
- id: CPP03-2.4-005
  type: definition
  modality: is
  normative: true
  title: White space in preprocessing
  statement: Preprocessing tokens may be separated by white space, which consists of comments,
    white-space characters, or both; white space can occur inside a token only in a header
    name or between the quotes of a character or string literal.
  subject: white space
  condition: between preprocessing tokens
  requirement: separates tokens
  exceptions: []
  depends_on: []
  related: []
