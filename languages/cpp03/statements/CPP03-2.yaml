- id: CPP03-2.4-001
  type: grammar
  modality: is
  normative: true
  title: preprocessing-token production
  statement: A preprocessing-token is a header-name, identifier, pp-number, character-literal,
    string-literal, preprocessing-op-or-punc, or a single non-white-space character that cannot
    be one of those.
  subject: preprocessing-token
  condition: always
  requirement: is one of the listed categories
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.4/grammar
