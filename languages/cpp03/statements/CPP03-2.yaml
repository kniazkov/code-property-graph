  verification: []
  status: draft
- id: CPP03-2.4-006
  type: requirement
  modality: is
  normative: true
  title: Maximal munch
  statement: The next preprocessing token is the longest character sequence that can form
    one, even if later lexical analysis then fails.
  subject: preprocessing token
  condition: when tokenizing
  requirement: is the longest possible sequence
  exceptions: []
  depends_on: []
  related: []
