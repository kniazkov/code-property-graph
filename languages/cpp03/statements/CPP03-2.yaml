- id: CPP03-2.4-003
  type: definition
  modality: is
  normative: true
  title: Preprocessing token categories
  statement: A preprocessing token is the smallest lexical unit in phases 3-6; categories
    include header names, identifiers, preprocessing numbers, character and string literals,
    preprocessing-op-or-punc, and lone non-white-space characters outside those categories.
  subject: preprocessing token
  condition: phases 3 through 6
  requirement: is the minimal lexical element
  exceptions: []
  depends_on: []
  related: []
  provenance:
    private_locator: 2.4/2
    fingerprint: sha256:873a0f03af2be3ec3dc248565fd9b5ed73856177f4d86dcdf2726f2266bd9f42
