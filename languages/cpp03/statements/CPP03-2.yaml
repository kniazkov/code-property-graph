  verification: []
  status: draft
- id: CPP03-2.4-004
  type: behavior_undefined
  modality: undefined
  normative: true
  title: Quote as a single-character token
  statement: The behavior is undefined if a single-quote or double-quote character matches
    the single-character preprocessing-token category.
  subject: single-character preprocessing token
  condition: the character is ' or "
  requirement: has undefined behavior
  exceptions: []
  depends_on: []
