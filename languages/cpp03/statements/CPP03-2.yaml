  type: requirement
  modality: is
  normative: true
  title: Trigraph replacement
  statement: Before any other processing, each listed trigraph sequence is replaced by the
    single character shown in Table 1.
  subject: trigraph sequence
  condition: before other processing
  requirement: is replaced by its single-character equivalent
  exceptions: []
  depends_on: []
