- id: CPP03-2.4-002
  type: requirement
  modality: shall
  normative: true
  title: Converted token form
  statement: Each preprocessing token that is converted to a token shall have the lexical
    form of a keyword, identifier, literal, operator, or punctuator.
  subject: converted preprocessing token
  condition: at conversion
  requirement: shall have a token lexical form
  exceptions: []
  depends_on: []
  related: []
